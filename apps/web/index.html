<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0b0d" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Cut</title>
    <script>
      // Apply the saved light/dark choice before anything is drawn, so the
      // app never flashes the wrong colours. Nothing saved = dark, as always.
      (function () {
        try {
          var saved = localStorage.getItem('cut-theme') || 'dark';
          var light =
            saved === 'light' ||
            (saved === 'system' && !window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (light) document.documentElement.dataset.theme = 'light';
          else delete document.documentElement.dataset.theme;
        } catch (e) {
          // Storage blocked (private browsing) — stay on the dark default.
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
